# Annotation Schema
# -----------------
# Each component is fully self-contained: its type identifier and all its
# configuration live together in the same entry.
#
# Root keys: only `components` is valid.
# Legacy root keys `span_labels` / `class_labels` are no longer supported.
#
# Supported component types (for now):
#   - span_highlight   → requires: labels[]  (name, color, hover_hint?)
#   - classification   → requires: options[] (label, value, hover_hint?)
#                        optional: question, multi_select

components:
  - type: span_highlight
    labels:
      - name: Actor
        color: "#FF5733"
        hover_hint: "Who is allegedly responsible for a malicious action or agenda?"
      - name: Action
        color: "#33FF57"
        hover_hint: "What is the actor doing or planning to do to cause negative outcomes?"
      - name: Victim
        color: "#3357FF"
        hover_hint: "Who is negatively affected by the actor's agenda?"
      - name: Threat
        color: "#FF33F6"
        hover_hint: "What is the actor doing or planning to do to cause negative outcomes?"
      - name: Evidence
        color: "#FFA500"
        hover_hint: "Which arguments or expressions does the writer of the text use to support his claims?"

  - type: classification
    question: "Is this text related to a conspiracy theory?"
    multi_select: false
    options:
      - label: Conspiracy
        value: "Yes"
      - label: Not Conspiracy
        value: "No"
      - label: Ambiguous
        value: "Can't tell"
