Vuoi un task Ibrido? Metti dati sia in span_labels che in class_labels. Il frontend le vede entrambe e le disegna entrambe.

Vuoi un task SOLO Evidenziazione (NER)? Lascia l'array class_labels: [] vuoto. Il frontend disattiverà automaticamente la sezione delle domande.

Vuoi un task SOLO Classificazione? Lascia l'array span_labels: [] vuoto. Il frontend nasconderà l'evidenziatore e mostrerà solo il testo normale (<div class="doc-text-preview" v-else>).